[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ayulm"
version = "0.1.0"
description = "Independent Large Language Model Research Project"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "sentencepiece>=0.2.0",
    "pyyaml>=6.0",
    "safetensors>=0.4"
]

[tool.setuptools.packages.find]
include = ["ayulm*"]
